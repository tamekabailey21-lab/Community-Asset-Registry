<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Community Asset Registry</title>
  <meta name="description" content="Search, browse, and propose entries in the Community Asset Registry.">
  <meta name="theme-color" content="#0f5c63">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#/" aria-label="Community Asset Registry home">
        <img src="favicon.svg" alt="" width="32" height="32">
        <span>Community Asset Registry</span>
      </a>
      <button class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="site-nav">
        <span class="sr-only">Toggle navigation</span>
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>
      <nav id="site-nav" class="site-nav" aria-label="Main">
        <a href="#/" data-route="home">Home</a>
        <a href="#/directory" data-route="directory">Directory</a>
        <a href="#/submit" data-route="submit">Add entry</a>
        <a href="#/about" data-route="about">About</a>
      </nav>

  </div>

    <p class="loading" role="status">Loading registry…</p>

    <div class="container footer-inner">
      <span>Community Asset Registry</span>
      <span class="muted">Static site hosted on GitHub Pages</span>
      <a href="#/about">Data &amp; privacy notes</a>
